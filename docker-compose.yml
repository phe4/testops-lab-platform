services:
  frontend:
    build:
      context: ./frontend
    container_name: testops-frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_BASE_URL: http://localhost:5000/api
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    container_name: testops-backend
    ports:
      - "5000:5000"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: testops_lab
      MYSQL_USER: testops_user
      MYSQL_PASSWORD: testops_password
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: testops-mysql
    environment:
      MYSQL_DATABASE: testops_lab
      MYSQL_USER: testops_user
      MYSQL_PASSWORD: testops_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mysql_data:
